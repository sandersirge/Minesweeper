name: Release

# Pushing a version tag (git tag -s v1.0.0 -m "Minesweeper 1.0.0" && git push origin v1.0.0)
# builds the packages for every platform and publishes them as a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Minesweeper $TAG" \
            --generate-notes --verify-tag
