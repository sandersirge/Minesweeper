name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.runner }}, ${{ matrix.sfml }} SFML)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 ships SFML 3 (libsfml-dev).
          - runner: ubuntu-26.04
            sfml: system
            packages: libsfml-dev
          # Ubuntu 24.04 only has SFML 2.6, so CMake downloads and builds SFML 3 itself.
          - runner: ubuntu-24.04
            sfml: fetched
            packages: >-
              libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev
              libgl1-mesa-dev libegl1-mesa-dev
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config ${{ matrix.packages }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Makefile build and tests
        if: matrix.sfml == 'system'
        run: make -j"$(nproc)" all && make test

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p sfml:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Makefile build and tests
        run: make -j"$(nproc)" all && make test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SFML and Ninja
        run: brew install sfml ninja pkgconf

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Makefile build and tests
        run: make -j"$(sysctl -n hw.ncpu)" all && make test
